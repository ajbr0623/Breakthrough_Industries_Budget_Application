<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Breakthrough Industries</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Header section, including the image and the header navigation bar-->
  <header>
    <div class="logo-image">
        <img src="images/budget.png" alt="logo">
    </div>
    <div class="top-row">
      <nav>
        <a href="index.html">Home</a>
        <a href="#">Bills</a>
        <a href="#">Paycheck</a>
        <a href="#">Reports</a>
        <a href="#">Help</a>
      </nav>
      <div class="auth-buttons">
        <button class="login">Login</button>
        <button class="signup">Signup</button>
      </div>
     </div>
  </header>

  <main>
    <section class="content-section">
      <h2>Contact Us</h2>
      <p class="intro">
        Have questions, feedback, or just want to say hello? We'd love to hear from you!
      </p>

      <form class="contact-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>
<!-- Footer section including social links and links to the other pages, including gallery, about, contact, and interests-->
  <footer>
    <div class="socials">
      <span>Follow us</span>
       <img src="https://img.icons8.com/ios-filled/24/facebook.png" alt="Facebook logo">
      <img src="https://img.icons8.com/ios-filled/24/twitterx.png" alt="TwitterX logo">
      <img src="https://img.icons8.com/ios-filled/24/instagram-new.png" alt="Instagram logo">
      <img src="https://img.icons8.com/ios-filled/24/youtube-play.png" alt="YouTube logo">
    </div>
    <div class="newsletter">
      <span>Get the Newsletter</span>
      <input type="email" placeholder="Your email address">
      <button>Subscribe</button>
    </div>
    <div class="footer-links">
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="interests.html">Interests</a>
    </div>
    <div class="copyright">
      El Reno, OK © 2025 Breakthrough Industries<br>
      All rights reserved.
    </div>
  </footer>
</body>
</html>
